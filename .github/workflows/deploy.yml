deploy:
  runs-on: ubuntu-latest
  needs: build
  permissions:
    id-token: write   # important pour GitHub → Azure login
    contents: read

  steps:
    - name: Download artifact
      uses: actions/download-artifact@v4
      with:
        name: python-app

    - name: Unzip artifact
      run: unzip release.zip -d release

    - name: Login to Azure
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_A18FFB99F74747918B8B1F61F9F5BC57 }}
        tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_84AF985AA15B4F938C9F18812F55C45E }}
        subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_CEB63CECFBEA4C768EBADE1D8D3AE52B }}

    - name: Deploy to Azure Functions (zip)
      uses: Azure/functions-action@v1
      with:
        app-name: 'mind-reading-func'
        package: 'release'

    - name: Test Function endpoint
      run: |
        echo "🚀 Testing deployed Azure Function..."
        RESPONSE=$(curl -s -i "https://mind-reading-func.azurewebsites.net/api/recommend?user_id=1")
        echo "------ Response ------"
        echo "$RESPONSE"
        STATUS=$(echo "$RESPONSE" | grep HTTP/ | tail -1 | awk '{print $2}')
        if [ "$STATUS" -ne 200 ]; then
          echo "❌ Function test failed (status $STATUS)"
          exit 1
        fi
        echo "✅ Function test passed"
