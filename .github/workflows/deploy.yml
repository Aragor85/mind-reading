name: Deploy to Azure Functions

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  AZURE_FUNCTIONAPP_NAME: mind-reading-func         # Nom de ta Function App
  RESOURCE_GROUP: mind-reading-rg                  # Nom du resource group
  AZURE_CONTAINER_REGISTRY: mindreading.azurecr.io # Nom de ton ACR
  IMAGE_NAME: mindreading                          # Nom de l'image
  TAG: latest                                      # Tag (modifiable)

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Log in to Azure
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_A18FFB99F74747918B8B1F61F9F5BC57 }}
        tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_84AF985AA15B4F938C9F18812F55C45E }}
        subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_CEB63CECFBEA4C768EBADE1D8D3AE52B }}

    - name: Log in to ACR
      run: |
        echo "${{ secrets.ACR_PASSWORD }}" | docker login ${{ env.AZURE_CONTAINER_REGISTRY }} \
          --username "${{ secrets.ACR_USERNAME }}" \
          --password-stdin

    - name: Build and push Docker image
      run: |
        docker build -t $AZURE_CONTAINER_REGISTRY/$IMAGE_NAME:$TAG .
        docker push $AZURE_CONTAINER_REGISTRY/$IMAGE_NAME:$TAG

    - name: Deploy to Azure Functions (set container)
      run: |
        az functionapp config container set \
          --name $AZURE_FUNCTIONAPP_NAME \
          --resource-group $RESOURCE_GROUP \
          --image $AZURE_CONTAINER_REGISTRY/$IMAGE_NAME:$TAG \
          --docker-registry-server-url https://$AZURE_CONTAINER_REGISTRY \
          --docker-registry-server-user "${{ secrets.ACR_USERNAME }}" \
          --docker-registry-server-password "${{ secrets.ACR_PASSWORD }}"

    - name: Restart Function App
      run: |
        az functionapp restart \
          --name $AZURE_FUNCTIONAPP_NAME \
          --resource-group $RESOURCE_GROUP
