name: Build & Deploy FunctionApp with Docker

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  AZURE_FUNCTIONAPP_NAME: 'mind-reading-func'
  AZURE_CONTAINER_REGISTRY: 'mindreading.azurecr.io'
  IMAGE_NAME: 'mind-reading-func'
  TAG: 'latest'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # Login to Azure
      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID }}

      # Login to ACR
      - name: Azure Container Registry login
        run: |
          echo ${{ secrets.ACR_PASSWORD }} | docker login ${{ env.AZURE_CONTAINER_REGISTRY }} --username ${{ secrets.ACR_USERNAME }} --password-stdin

      # Build and push Docker image
      - name: Build and push image
        run: |
          docker build -t $AZURE_CONTAINER_REGISTRY/$IMAGE_NAME:$TAG .
          docker push $AZURE_CONTAINER_REGISTRY/$IMAGE_NAME:$TAG

      # Deploy Function App with container
      - name: Deploy to Azure Functions
        run: |
          az functionapp update \
            --name $AZURE_FUNCTIONAPP_NAME \
            --resource-group mind-reading-rg \
            --set containerImage=$AZURE_CONTAINER_REGISTRY/$IMAGE_NAME:$TAG

      # Test Function endpoint
      - name: Test Function endpoint
        run: |
          echo "🚀 Testing deployed Azure Function..."
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}\n" "https://${{ env.AZURE_FUNCTIONAPP_NAME }}.azurewebsites.net/api/recommend?user_id=1")
          echo "$RESPONSE"
          BODY=$(echo "$RESPONSE" | sed '/HTTP_STATUS/d')
          STATUS=$(echo "$RESPONSE" | grep HTTP_STATUS | cut -d: -f2)
          echo "📦 Response body: $BODY"
          if [ "$STATUS" -ne 200 ]; then
            echo "❌ Function test failed (status $STATUS)"
            exit 1
          fi
          echo "✅ Function test passed"
